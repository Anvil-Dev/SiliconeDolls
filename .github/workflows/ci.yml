name: CI for Mod
on:
  workflow_dispatch:
  push:
    branches:
      - releases/**
    paths:
      - src/**
      - common/**
      - fabric/**
      - forge/**
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_BUILD: true
      PR_BUILD: false
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Checkout matching RollingGate
        uses: actions/checkout@v4
        with:
          repository: Anvil-Dev/RollingGate
          ref: releases/1.21.10
          path: .dependencies/RollingGate

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version minecraft_version rolling_gate_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build -Prolling_gate_source=.dependencies/RollingGate

      - name: Get Version
        id: version
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '${{ steps.properties.outputs.mod_id }}-*-mc${{ steps.properties.outputs.minecraft_version }}.jar' -print -quit)
          MESSAGE=${JAR##*/}
          MESSAGE=${MESSAGE#${{ steps.properties.outputs.mod_id }}-}
          MESSAGE=${MESSAGE%-mc${{ steps.properties.outputs.minecraft_version }}.jar}
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-${{ steps.version.outputs.version }}-mc${{ steps.properties.outputs.minecraft_version }}.jar

      - name: Publish to maven
        run: ./gradlew publish -Prolling_gate_source=.dependencies/RollingGate
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        continue-on-error: true

      - name: gametest
        uses: Anvil-Dev/dedicated-server-launch-test@1.21.10-neoforge
        with:
          mods: |
            build/libs/${{ steps.properties.outputs.mod_id }}-${{ steps.version.outputs.version }}-mc${{ steps.properties.outputs.minecraft_version }}.jar
            .dependencies/RollingGate/build/libs/rolling_gate-*-mc${{ steps.properties.outputs.minecraft_version }}.jar

      - name: publish neoforge mc mod
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          name: "${{ steps.properties.outputs.mod_name }} For NeoForge v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          game-versions: ${{ steps.properties.outputs.minecraft_version }}
          version-type: "alpha"
          java: 21
          fail-mode: skip
          changelog: ${{ github.event.head_commit.message }}
          dependencies: |
            rolling_gate@${{ steps.properties.outputs.rolling_gate_version }}(required){modrinth:HXsmHiKu}{curseforge:1194894}

          modrinth-id: 7rBlSqmp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-id: 1197018
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/${{ steps.properties.outputs.mod_id }}-${{ steps.version.outputs.version }}-mc${{ steps.properties.outputs.minecraft_version }}.jar
            build/libs/${{ steps.properties.outputs.mod_id }}-${{ steps.version.outputs.version }}-mc${{ steps.properties.outputs.minecraft_version }}-sources.jar
